<!doctype html>
<html>
<head>
    <title>Add User</title>
</head>
<body>
    <h1>Add User</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="post">
        <label>Name:</label>
        <input type="text" name="name">

        <br><br>

        <label>Email:</label>
        <input type="email" name="email">

        <br><br>

        <button type="submit">Add User</button>
    </form>
</body>
</html>
